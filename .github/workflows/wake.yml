name: Keep Render Awake

on:
  schedule:
    # 每10分钟运行一次（UTC时间）
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://attendance-bot.onrender.com/api/check_login
          curl -s -o /dev/null -w "%{http_code}" https://attendance-bot.onrender.com/wechat?echostr=ping
