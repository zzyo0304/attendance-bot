name: Keep Render Awake

on:
  schedule:
    # 每2分钟运行一次，防止Render 15分钟休眠
    - cron: "*/2 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          echo "=== $(date -u) ==="
          curl -s -w "\nHTTP:%{http_code}" https://attendance-bot-apyz.onrender.com/api/health
          echo ""
          curl -s -w "\nHTTP:%{http_code}" https://attendance-bot-apyz.onrender.com/api/check_login
          echo ""
          echo "Done."
