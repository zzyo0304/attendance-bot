name: Keep Render & Neon Awake

on:
  schedule:
    # 每2分钟运行一次
    - cron: "*/2 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render & Neon
        run: |
          echo "=== $(date -u) ==="
          curl -s -w "\nHTTP:%{http_code}" https://attendance-bot-apyz.onrender.com/api/health
          echo ""
          echo "Done."
