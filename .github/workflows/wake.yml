name: Keep Render & Supabase Awake

on:
  schedule:
    # 每10分钟运行一次（UTC时间）
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render & Supabase
        run: |
          echo "=== $(date -u) ==="
          echo "Pinging health check (hits DB for Supabase)..."
          curl -s -w "\nHTTP:%{http_code}" https://attendance-bot-apyz.onrender.com/api/health
          echo ""
          echo "Pinging API (hits DB for Supabase)..."
          curl -s -w "\nHTTP:%{http_code}" https://attendance-bot-apyz.onrender.com/api/check_login
          echo ""
          echo "Done."
