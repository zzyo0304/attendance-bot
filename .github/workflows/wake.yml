name: Keep Render Awake

on:
  schedule:
    # 每10分钟运行一次（UTC时间）
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          echo "Pinging home page..."
          curl -s -o /dev/null -w "Home: %{http_code}\n" https://attendance-bot-apyz.onrender.com/
          echo "Pinging admin page..."
          curl -s -o /dev/null -w "Admin: %{http_code}\n" https://attendance-bot-apyz.onrender.com/admin
          echo "Pinging wechat endpoint..."
          curl -s -o /dev/null -w "WeChat: %{http_code}\n" https://attendance-bot-apyz.onrender.com/wechat?echostr=ping
